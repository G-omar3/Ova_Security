  <rect x="40" y="190" width="300" height="700" class="panel"/>
  <text x="85" y="240" class="titleBlue">Sources &amp; local network</text>
  <rect x="70" y="285" width="240" height="92" class="inner"/><text x="95" y="340" class="icon">NET</text><text x="170" y="333" class="txt">Network traffic</text>
  <rect x="70" y="405" width="240" height="92" class="inner"/><text x="95" y="460" class="icon">ADM</text><text x="170" y="453" class="txt">Admin station</text>
  <rect x="70" y="525" width="240" height="92" class="inner"/><text x="95" y="580" class="icon">LAN</text><text x="170" y="573" class="txt">Endpoints</text>
  <rect x="70" y="645" width="240" height="92" class="inner"/><text x="95" y="700" class="icon">SRV</text><text x="170" y="693" class="txt">Servers / IoT</text>
