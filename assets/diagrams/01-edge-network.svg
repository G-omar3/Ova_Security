  <rect x="1230" y="250" width="130" height="88" class="inner"/><text x="1260" y="300" class="txt">Assets</text>
  <rect x="1380" y="250" width="130" height="88" class="inner"/><text x="1412" y="300" class="txt">Alerts</text>
  <rect x="1230" y="365" width="130" height="88" class="inner"/><text x="1256" y="415" class="txt">Incidents</text>
  <rect x="1380" y="365" width="130" height="88" class="inner"/><text x="1410" y="415" class="txt">Reports</text>
  <rect x="1230" y="480" width="130" height="88" class="inner"/><text x="1254" y="530" class="txt">Services</text>
  <rect x="1380" y="480" width="130" height="88" class="inner"/><text x="1408" y="530" class="txt">Audit</text>
