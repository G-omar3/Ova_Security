  <rect x="360" y="975" width="900" height="55" class="bottom"/><text x="430" y="1010" class="titleBlue">Detection</text><text x="640" y="1010" class="titleGreen">Protection</text><text x="855" y="1010" class="titleBlue">Supervision</text><text x="1070" y="1010" class="titleGreen">Assisted analysis</text>
