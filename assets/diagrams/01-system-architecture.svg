<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Ova Security system architecture</title><desc id="desc">Sources, appliance core, dashboard, assistant, and evidence in one product architecture.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1E5AA8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F33" flood-opacity=".10"/></filter><style>.bg{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#C9D6E2;stroke-width:2.2;rx:26}.box{fill:#FFFFFF;stroke:#C9D6E2;stroke-width:1.7;rx:16;filter:url(#shadow)}.boxBlue{fill:#EEF5FC;stroke:#1E5AA8;stroke-width:2;rx:16;filter:url(#shadow)}.boxTeal{fill:#EAF6F8;stroke:#0F8B8D;stroke-width:2;rx:16;filter:url(#shadow)}.boxGreen{fill:#EAF7EF;stroke:#2E8B57;stroke-width:2;rx:16;filter:url(#shadow)}.boxViolet{fill:#F1F0FA;stroke:#6C5BA7;stroke-width:2;rx:16;filter:url(#shadow)}.boxAmber{fill:#F7F1E3;stroke:#A07A2B;stroke-width:2;rx:16;filter:url(#shadow)}.title{font:800 34px Arial;fill:#0B1F33}.subtitle{font:italic 21px Arial;fill:#4B5B6B}.section{font:800 22px Arial;fill:#0B1F33}.text{font:500 16px Arial;fill:#253545}.small{font:500 14px Arial;fill:#4B5B6B}.tag{font:800 14px Arial;fill:#1E5AA8;letter-spacing:1.4px}.arrow{stroke:#1E5AA8;stroke-width:4;fill:none;marker-end:url(#arrow)}.arrowSoft{stroke:#6F8CAD;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6F8CAD;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}.divider{stroke:#C9D6E2;stroke-width:1.5}.num{font:800 18px Arial;fill:#1E5AA8}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="title">Ova Security system architecture</text><text x="70" y="112" class="subtitle">Sources, appliance core, dashboard, assistant, and evidence in one product architecture.</text><rect x="70" y="175" width="305" height="610" class="boxBlue"/><text x="120" y="225" class="section">Local sources</text><rect x="105" y="270" width="235" height="70" class="box"/><text x="135" y="312" class="text">Network flows</text><rect x="105" y="370" width="235" height="70" class="box"/><text x="135" y="412" class="text">Endpoints and servers</text><rect x="105" y="470" width="235" height="70" class="box"/><text x="135" y="512" class="text">System services</text><rect x="465" y="150" width="585" height="700" class="boxTeal"/><text x="680" y="200" class="section">Ova Security appliance</text><rect x="505" y="245" width="505" height="115" class="box"/><text x="535" y="288" class="section">Observe</text><text x="535" y="318" class="text">alerts, flows, assets, service health</text><rect x="505" y="395" width="505" height="115" class="box"/><text x="535" y="438" class="section">Protect</text><text x="535" y="468" class="text">filtering, blocking, segmentation</text><rect x="505" y="545" width="505" height="115" class="box"/><text x="535" y="588" class="section">Orchestrate</text><text x="535" y="618" class="text">API, risk scoring, reports, workflow</text><rect x="505" y="695" width="505" height="95" class="box"/><text x="535" y="738" class="section">Prove</text><text x="535" y="768" class="text">signed records and audit verification</text><rect x="1140" y="175" width="340" height="270" class="boxBlue"/><text x="1238" y="225" class="section">Dashboard</text><text x="1180" y="275" class="text">supervision and validated actions</text><rect x="1140" y="515" width="340" height="270" class="boxViolet"/><text x="1250" y="565" class="section">Assistant</text><text x="1180" y="615" class="text">context retrieval and guidance</text><path d="M375 480h90" class="arrow"/><path d="M1050 300h90" class="arrow"/><path d="M1050 650h90" class="arrow"/></svg>