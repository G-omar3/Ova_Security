<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Ova Security - internal architecture</title>
  <desc id="desc">Layered internal architecture inspired by the technical report design.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1254d8"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0a2a52" flood-opacity=".09"/></filter><style>.bg{fill:#fff}.frame{fill:none;stroke:#d6e0ea;stroke-width:2.4;rx:26}.title{font:800 36px Arial;fill:#0b2d63}.sub{font:italic 24px Arial;fill:#0b2d63}.group{fill:#fbfdff;stroke:#0b56e5;stroke-width:2.2;rx:22;filter:url(#s)}.groupG{fill:#fbfffc;stroke:#087532;stroke-width:2.2;rx:22;filter:url(#s)}.box{fill:#fff;stroke:#c8d5df;stroke-width:1.6;rx:14}.boxG{fill:#f6fff8;stroke:#b7d2bf;stroke-width:1.6;rx:14}.hB{font:800 23px Arial;fill:#0b56e5}.hG{font:800 23px Arial;fill:#087532}.txt{font:500 17px Arial;fill:#1d2633}.line{stroke:#1254d8;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="980"/>
  <rect x="24" y="24" width="1552" height="932" class="frame"/>
  <text x="80" y="80" class="title">Ova Security internal logical architecture</text>
  <text x="80" y="120" class="sub">From appliance runtime to security orchestration, supervision, evidence, and assistance</text>
  <rect x="170" y="170" width="1260" height="120" class="group"/>
  <text x="220" y="220" class="hB">Appliance platform</text><text x="220" y="255" class="txt">Hardware, Linux runtime, network interfaces, local storage, service supervision, scheduled jobs</text>
  <rect x="170" y="350" width="1260" height="190" class="groupG"/>
  <text x="220" y="400" class="hG">Security services</text>
  <rect x="225" y="440" width="250" height="65" class="box"/><text x="270" y="480" class="txt">Firewall filtering</text>
  <rect x="515" y="440" width="250" height="65" class="box"/><text x="565" y="480" class="txt">Intrusion detection</text>
  <rect x="805" y="440" width="250" height="65" class="box"/><text x="852" y="480" class="txt">Traffic analysis</text>
  <rect x="1095" y="440" width="250" height="65" class="box"/><text x="1130" y="480" class="txt">Vulnerability view</text>
  <rect x="170" y="600" width="1260" height="190" class="group"/>
  <text x="220" y="650" class="hB">Application services</text>
  <rect x="225" y="690" width="210" height="65" class="boxG"/><text x="280" y="730" class="txt">Dashboard</text>
  <rect x="470" y="690" width="210" height="65" class="boxG"/><text x="527" y="730" class="txt">Reports</text>
  <rect x="715" y="690" width="210" height="65" class="boxG"/><text x="748" y="730" class="txt">Rule workflow</text>
  <rect x="960" y="690" width="210" height="65" class="boxG"/><text x="1005" y="730" class="txt">Risk engine</text>
  <rect x="1205" y="690" width="160" height="65" class="boxG"/><text x="1240" y="730" class="txt">Search</text>
  <rect x="170" y="850" width="580" height="80" class="groupG"/><text x="230" y="900" class="hG">Signed evidence register</text>
  <rect x="850" y="850" width="580" height="80" class="group"/><text x="940" y="900" class="hB">Assistant and knowledge layer</text>
  <path class="line" d="M800 290v60"/><path class="line" d="M800 540v60"/><path class="line" d="M620 790v60"/><path class="line" d="M980 790v60"/>
</svg>
