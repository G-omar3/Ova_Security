<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ova Security technology role map</title>
  <desc id="desc">Technology map showing platform, security, application, and assistant components.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a2340" flood-opacity=".12"/></filter><style>.bg{fill:#f7fbfd}.title{font:800 34px Arial;fill:#082847}.k{font:700 16px Arial;fill:#008b96;letter-spacing:2px}.col{fill:#fff;stroke:#d8e6f0;stroke-width:2;rx:18;filter:url(#shadow)}.head{fill:#071c33;rx:18}.headText{font:800 22px Arial;fill:#fff}.item{fill:#f3f8fb;stroke:#c9dbe7;stroke-width:1.6;rx:12}.item2{fill:#e9fbfb;stroke:#00a3ad}.item3{fill:#f2fbf5;stroke:#2aa865}.item4{fill:#f4f0ff;stroke:#7452c7}.h{font:800 18px Arial;fill:#082847}.p{font:500 14px Arial;fill:#566779}</style></defs>
  <rect class="bg" width="1280" height="720"/>
  <text x="55" y="60" class="k">TECHNOLOGY ROLE MAP</text><text x="55" y="102" class="title">Open-source building blocks integrated into one product</text>
  <g transform="translate(55 145)"><rect class="col" width="265" height="500"/><rect class="head" width="265" height="68"/><text x="28" y="43" class="headText">Platform</text><rect x="24" y="100" width="217" height="70" class="item"/><text x="42" y="130" class="h">Linux OS</text><text x="42" y="154" class="p">runtime and services</text><rect x="24" y="195" width="217" height="70" class="item"/><text x="42" y="225" class="h">System timers</text><text x="42" y="249" class="p">scheduled collection</text><rect x="24" y="290" width="217" height="70" class="item"/><text x="42" y="320" class="h">Local storage</text><text x="42" y="344" class="p">logs and evidence</text></g>
  <g transform="translate(355 145)"><rect class="col" width="265" height="500"/><rect class="head" width="265" height="68"/><text x="28" y="43" class="headText">Security</text><rect x="24" y="100" width="217" height="70" class="item2"/><text x="42" y="130" class="h">Firewall</text><text x="42" y="154" class="p">filtering and isolation</text><rect x="24" y="195" width="217" height="70" class="item2"/><text x="42" y="225" class="h">IDS analysis</text><text x="42" y="249" class="p">alerts and metadata</text><rect x="24" y="290" width="217" height="70" class="item2"/><text x="42" y="320" class="h">Scanner</text><text x="42" y="344" class="p">exposure visibility</text></g>
  <g transform="translate(655 145)"><rect class="col" width="265" height="500"/><rect class="head" width="265" height="68"/><text x="28" y="43" class="headText">Application</text><rect x="24" y="100" width="217" height="70" class="item3"/><text x="42" y="130" class="h">Dashboard</text><text x="42" y="154" class="p">operator overview</text><rect x="24" y="195" width="217" height="70" class="item3"/><text x="42" y="225" class="h">Reports</text><text x="42" y="249" class="p">findings and status</text><rect x="24" y="290" width="217" height="70" class="item3"/><text x="42" y="320" class="h">Workflow</text><text x="42" y="344" class="p">validated changes</text></g>
  <g transform="translate(955 145)"><rect class="col" width="265" height="500"/><rect class="head" width="265" height="68"/><text x="28" y="43" class="headText">Intelligence</text><rect x="24" y="100" width="217" height="70" class="item4"/><text x="42" y="130" class="h">Knowledge base</text><text x="42" y="154" class="p">docs and procedures</text><rect x="24" y="195" width="217" height="70" class="item4"/><text x="42" y="225" class="h">Assistant</text><text x="42" y="249" class="p">explanations</text><rect x="24" y="290" width="217" height="70" class="item4"/><text x="42" y="320" class="h">Audit helper</text><text x="42" y="344" class="p">evidence reading</text></g>
</svg>
