<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Technology role map</title><desc id="desc">Main technology families and how they connect inside the Ova Security appliance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1E5AA8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F33" flood-opacity=".10"/></filter><style>.bg{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#C9D6E2;stroke-width:2.2;rx:26}.box{fill:#FFFFFF;stroke:#C9D6E2;stroke-width:1.7;rx:16;filter:url(#shadow)}.boxBlue{fill:#EEF5FC;stroke:#1E5AA8;stroke-width:2;rx:16;filter:url(#shadow)}.boxTeal{fill:#EAF6F8;stroke:#0F8B8D;stroke-width:2;rx:16;filter:url(#shadow)}.boxGreen{fill:#EAF7EF;stroke:#2E8B57;stroke-width:2;rx:16;filter:url(#shadow)}.boxViolet{fill:#F1F0FA;stroke:#6C5BA7;stroke-width:2;rx:16;filter:url(#shadow)}.boxAmber{fill:#F7F1E3;stroke:#A07A2B;stroke-width:2;rx:16;filter:url(#shadow)}.title{font:800 34px Arial;fill:#0B1F33}.subtitle{font:italic 21px Arial;fill:#4B5B6B}.section{font:800 22px Arial;fill:#0B1F33}.text{font:500 16px Arial;fill:#253545}.small{font:500 14px Arial;fill:#4B5B6B}.tag{font:800 14px Arial;fill:#1E5AA8;letter-spacing:1.4px}.arrow{stroke:#1E5AA8;stroke-width:4;fill:none;marker-end:url(#arrow)}.arrowSoft{stroke:#6F8CAD;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6F8CAD;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}.divider{stroke:#C9D6E2;stroke-width:1.5}.num{font:800 18px Arial;fill:#1E5AA8}</style></defs><rect class="bg" width="1600" height="900"/><rect x="24" y="24" width="1552" height="852" class="frame"/><text x="70" y="76" class="title">Technology role map</text><text x="70" y="112" class="subtitle">Main technology families and how they connect inside the Ova Security appliance.</text><rect x="90" y="180" width="330" height="250" class="boxBlue"/><text x="145" y="235" class="section">Platform</text><text x="135" y="285" class="text">Linux runtime</text><text x="135" y="325" class="text">service supervision</text><text x="135" y="365" class="text">local storage</text>
<rect x="635" y="160" width="330" height="290" class="boxTeal"/><text x="700" y="215" class="section">Security core</text><text x="685" y="265" class="text">firewall</text><text x="685" y="305" class="text">detection</text><text x="685" y="345" class="text">traffic analysis</text><text x="685" y="385" class="text">vulnerability visibility</text>
<rect x="1180" y="180" width="330" height="250" class="boxGreen"/><text x="1240" y="235" class="section">Application</text><text x="1230" y="285" class="text">backend API</text><text x="1230" y="325" class="text">dashboard</text><text x="1230" y="365" class="text">reports and workflow</text>
<rect x="375" y="575" width="330" height="190" class="boxViolet"/><text x="450" y="630" class="section">Assistant</text><text x="420" y="680" class="text">RAG context and explanations</text>
<rect x="895" y="575" width="330" height="190" class="boxAmber"/><text x="965" y="630" class="section">Evidence</text><text x="935" y="680" class="text">hash chain and signatures</text>
