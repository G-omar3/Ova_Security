<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Ova Security - data and evidence model</title>
  <desc id="desc">Data and evidence model inspired by the report visual structure.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1254d8"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0a2a52" flood-opacity=".09"/></filter><style>.bg{fill:#fff}.frame{fill:none;stroke:#d6e0ea;stroke-width:2.4;rx:26}.title{font:800 36px Arial;fill:#0b2d63}.sub{font:italic 23px Arial;fill:#0b2d63}.panel{fill:#fbfdff;stroke:#0b56e5;stroke-width:2.1;rx:22;filter:url(#s)}.panelG{fill:#fbfffc;stroke:#087532;stroke-width:2.1;rx:22;filter:url(#s)}.box{fill:#fff;stroke:#c8d5df;stroke-width:1.5;rx:14}.boxG{fill:#f7fff9;stroke:#b4d1be;stroke-width:1.5;rx:14}.hB{font:800 24px Arial;fill:#0b56e5}.hG{font:800 24px Arial;fill:#087532}.txt{font:600 17px Arial;fill:#1d2633}.small{font:500 15px Arial;fill:#526171}.arrow{stroke:#1254d8;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="880"/>
  <rect x="24" y="24" width="1552" height="832" class="frame"/>
  <text x="70" y="78" class="title">Data and evidence model</text><text x="70" y="116" class="sub">Separate raw signals, normalized context, decisions, and verifiable records</text>
  <rect x="70" y="180" width="300" height="520" class="panel"/>
  <text x="115" y="230" class="hB">Raw sources</text>
  <rect x="105" y="270" width="230" height="65" class="box"/><text x="135" y="310" class="txt">Network sessions</text>
  <rect x="105" y="360" width="230" height="65" class="box"/><text x="135" y="400" class="txt">Detection alerts</text>
  <rect x="105" y="450" width="230" height="65" class="box"/><text x="135" y="490" class="txt">System events</text>
  <rect x="105" y="540" width="230" height="65" class="box"/><text x="135" y="580" class="txt">Scanner findings</text>
  <rect x="475" y="165" width="650" height="560" class="panelG"/>
  <text x="695" y="215" class="hG">Ova Security data processing</text>
  <rect x="525" y="260" width="250" height="92" class="box"/><text x="575" y="300" class="txt">Normalize</text><text x="575" y="327" class="small">fields, time, source, target</text>
  <rect x="825" y="260" width="250" height="92" class="box"/><text x="875" y="300" class="txt">Correlate</text><text x="875" y="327" class="small">assets, services, rules</text>
  <rect x="525" y="420" width="250" height="92" class="box"/><text x="575" y="460" class="txt">Prioritize</text><text x="575" y="487" class="small">severity, exposure, context</text>
  <rect x="825" y="420" width="250" height="92" class="box"/><text x="875" y="460" class="txt">Decide</text><text x="875" y="487" class="small">operator validation</text>
  <rect x="640" y="580" width="330" height="78" class="boxG"/><text x="705" y="627" class="txt">Signed audit record</text>
  <rect x="1230" y="180" width="300" height="520" class="panel"/>
  <text x="1280" y="230" class="hB">Outputs</text>
  <rect x="1265" y="270" width="230" height="65" class="box"/><text x="1295" y="310" class="txt">Dashboard status</text>
  <rect x="1265" y="360" width="230" height="65" class="box"/><text x="1295" y="400" class="txt">Incident report</text>
  <rect x="1265" y="450" width="230" height="65" class="box"/><text x="1295" y="490" class="txt">Firewall decision</text>
  <rect x="1265" y="540" width="230" height="65" class="box"/><text x="1295" y="580" class="txt">Audit evidence</text>
  <path class="arrow" d="M370 440h105"/><path class="arrow" d="M775 306h50"/><path class="arrow" d="M650 352v68"/><path class="arrow" d="M950 352v68"/><path class="arrow" d="M775 466h50"/><path class="arrow" d="M970 620h260"/><text x="520" y="790" class="sub">Every sensitive decision is linked to context and preserved as evidence.</text>
</svg>
