<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ova Security data and evidence model</title>
  <desc id="desc">Data flow from raw signals to normalized events, asset context, decisions, and signed evidence.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a2340" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0b355d"/></marker><style>.bg{fill:#f7fbfd}.title{font:800 34px Arial;fill:#082847}.k{font:700 16px Arial;fill:#008b96;letter-spacing:2px}.box{fill:#fff;stroke:#d8e6f0;stroke-width:2;rx:18;filter:url(#shadow)}.blue{fill:#edf6ff;stroke:#3b7fc0}.cyan{fill:#e9fbfb;stroke:#0097a7}.green{fill:#f2fbf5;stroke:#2aa865}.purple{fill:#f4f0ff;stroke:#7452c7}.h{font:800 22px Arial;fill:#082847}.p{font:500 15px Arial;fill:#566779}.line{stroke:#0b355d;stroke-width:2.8;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1280" height="720"/>
  <text x="55" y="60" class="k">DATA AND EVIDENCE MODEL</text><text x="55" y="102" class="title">From technical signals to verifiable security records</text>
  <rect x="55" y="175" width="245" height="290" class="box blue"/><text x="88" y="222" class="h">Raw signals</text><text x="88" y="260" class="p">Network sessions</text><text x="88" y="292" class="p">IDS alerts</text><text x="88" y="324" class="p">System events</text><text x="88" y="356" class="p">Scanner findings</text>
  <rect x="370" y="130" width="250" height="150" class="box cyan"/><text x="404" y="182" class="h">Normalize</text><text x="404" y="215" class="p">Clean fields, timestamps,</text><text x="404" y="240" class="p">severity, source, target.</text>
  <rect x="370" y="360" width="250" height="150" class="box cyan"/><text x="404" y="412" class="h">Correlate</text><text x="404" y="445" class="p">Connect events to assets,</text><text x="404" y="470" class="p">rules, users, and services.</text>
  <rect x="700" y="175" width="245" height="290" class="box green"/><text x="733" y="222" class="h">Decisions</text><text x="733" y="260" class="p">Block or allow</text><text x="733" y="292" class="p">Accept risk</text><text x="733" y="324" class="p">Open remediation</text><text x="733" y="356" class="p">Generate report</text>
  <rect x="1015" y="175" width="210" height="290" class="box purple"/><text x="1048" y="222" class="h">Evidence</text><text x="1048" y="260" class="p">Hash</text><text x="1048" y="292" class="p">Chain</text><text x="1048" y="324" class="p">Sign</text><text x="1048" y="356" class="p">Verify</text>
  <path class="line" d="M300 315 C335 315 340 205 370 205"/><path class="line" d="M300 335 C335 335 340 435 370 435"/><path class="line" d="M620 205 C670 205 670 320 700 320"/><path class="line" d="M620 435 C670 435 670 320 700 320"/><path class="line" d="M945 320h70"/>
  <text x="370" y="590" class="p">The model keeps raw collection, operational decisions, and signed audit records separated.</text>
</svg>
