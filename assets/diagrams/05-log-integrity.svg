<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ova Security - log integrity workflow</title>
  <desc id="desc">Log lifecycle and signed ledger workflow in report style.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1254d8"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0a2a52" flood-opacity=".09"/></filter><style>.bg{fill:#fff}.frame{fill:none;stroke:#d6e0ea;stroke-width:2.4;rx:26}.title{font:800 36px Arial;fill:#0b2d63}.sub{font:italic 23px Arial;fill:#0b2d63}.panel{fill:#fbfdff;stroke:#0b56e5;stroke-width:2.1;rx:22;filter:url(#s)}.panelG{fill:#fbfffc;stroke:#087532;stroke-width:2.1;rx:22;filter:url(#s)}.box{fill:#fff;stroke:#c8d5df;stroke-width:1.5;rx:14}.boxG{fill:#f5fff8;stroke:#afd0bb;stroke-width:1.5;rx:14}.hB{font:800 24px Arial;fill:#0b56e5}.hG{font:800 24px Arial;fill:#087532}.txt{font:600 17px Arial;fill:#1d2633}.small{font:500 15px Arial;fill:#526171}.arrow{stroke:#1254d8;stroke-width:5;fill:none;marker-end:url(#a)}.dash{stroke:#1254d8;stroke-width:4;stroke-dasharray:8 8;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="1000"/>
  <rect x="24" y="24" width="1552" height="952" class="frame"/>
  <text x="70" y="78" class="title">Log management and integrity register</text><text x="70" y="116" class="sub">Reduce volume without losing traceability or proof</text>
  <rect x="60" y="180" width="360" height="640" class="panel"/>
  <text x="135" y="230" class="hB">Log sources</text>
  <rect x="100" y="285" width="280" height="78" class="box"/><text x="145" y="325" class="txt">Network alerts</text><text x="145" y="350" class="small">detection events</text>
  <rect x="100" y="395" width="280" height="78" class="box"/><text x="145" y="435" class="txt">Traffic metadata</text><text x="145" y="460" class="small">flows and protocols</text>
  <rect x="100" y="505" width="280" height="78" class="box"/><text x="145" y="545" class="txt">System services</text><text x="145" y="570" class="small">runtime state</text>
  <rect x="100" y="615" width="280" height="78" class="box"/><text x="145" y="655" class="txt">Admin actions</text><text x="145" y="680" class="small">sensitive changes</text>
  <rect x="530" y="180" width="360" height="640" class="panelG"/>
  <text x="610" y="230" class="hG">Lifecycle</text>
  <rect x="575" y="285" width="270" height="70" class="boxG"/><text x="650" y="328" class="txt">Collect</text>
  <rect x="575" y="390" width="270" height="70" class="boxG"/><text x="650" y="433" class="txt">Rotate</text>
  <rect x="575" y="495" width="270" height="70" class="boxG"/><text x="625" y="538" class="txt">Compress</text>
  <rect x="575" y="600" width="270" height="70" class="boxG"/><text x="640" y="643" class="txt">Retain</text>
  <path class="arrow" d="M710 355v35"/><path class="arrow" d="M710 460v35"/><path class="arrow" d="M710 565v35"/>
  <rect x="1000" y="180" width="520" height="640" class="panel"/>
  <text x="1150" y="230" class="hB">Traceability</text>
  <rect x="1055" y="285" width="410" height="70" class="box"/><text x="1120" y="328" class="txt">Hash each important event</text>
  <rect x="1055" y="405" width="410" height="70" class="box"/><text x="1120" y="448" class="txt">Chain previous and current hash</text>
  <rect x="1055" y="525" width="410" height="70" class="box"/><text x="1120" y="568" class="txt">Sign the local ledger</text>
  <rect x="1055" y="645" width="410" height="70" class="boxG"/><text x="1120" y="688" class="txt">Verify integrity during audit</text>
  <path class="arrow" d="M420 490h110"/><path class="arrow" d="M890 490h110"/><path class="dash" d="M710 670 C710 900 1260 900 1260 715"/>
  <text x="1075" y="875" class="sub">If a record is modified, the hash chain breaks and the alteration becomes visible.</text>
</svg>
