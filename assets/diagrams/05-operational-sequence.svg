<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Operational sequence</title><desc id="desc">Operator workflow from network observation to validated enforcement and audit proof.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1E5AA8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F33" flood-opacity=".10"/></filter><style>.bg{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#C9D6E2;stroke-width:2.2;rx:26}.box{fill:#FFFFFF;stroke:#C9D6E2;stroke-width:1.7;rx:16;filter:url(#shadow)}.boxBlue{fill:#EEF5FC;stroke:#1E5AA8;stroke-width:2;rx:16;filter:url(#shadow)}.boxTeal{fill:#EAF6F8;stroke:#0F8B8D;stroke-width:2;rx:16;filter:url(#shadow)}.boxGreen{fill:#EAF7EF;stroke:#2E8B57;stroke-width:2;rx:16;filter:url(#shadow)}.boxViolet{fill:#F1F0FA;stroke:#6C5BA7;stroke-width:2;rx:16;filter:url(#shadow)}.boxAmber{fill:#F7F1E3;stroke:#A07A2B;stroke-width:2;rx:16;filter:url(#shadow)}.title{font:800 34px Arial;fill:#0B1F33}.subtitle{font:italic 21px Arial;fill:#4B5B6B}.section{font:800 22px Arial;fill:#0B1F33}.text{font:500 16px Arial;fill:#253545}.small{font:500 14px Arial;fill:#4B5B6B}.tag{font:800 14px Arial;fill:#1E5AA8;letter-spacing:1.4px}.arrow{stroke:#1E5AA8;stroke-width:4;fill:none;marker-end:url(#arrow)}.arrowSoft{stroke:#6F8CAD;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6F8CAD;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}.divider{stroke:#C9D6E2;stroke-width:1.5}.num{font:800 18px Arial;fill:#1E5AA8}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="title">Operational sequence</text><text x="70" y="112" class="subtitle">Operator workflow from network observation to validated enforcement and audit proof.</text><rect x="95" y="210" width="260" height="90" class="boxBlue"/><text x="145" y="2