<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ova Security assistant and knowledge architecture</title>
  <desc id="desc">Assistant architecture using local documentation, reports, logs, alerts, retrieval, language model response, and human validation.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a2340" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0b355d"/></marker><style>.bg{fill:#f7fbfd}.title{font:800 34px Arial;fill:#082847}.k{font:700 16px Arial;fill:#008b96;letter-spacing:2px}.box{fill:#fff;stroke:#d8e6f0;stroke-width:2;rx:18;filter:url(#shadow)}.ai{fill:#f4f0ff;stroke:#7452c7}.ctx{fill:#e9fbfb;stroke:#0097a7}.human{fill:#f2fbf5;stroke:#2aa865}.h{font:800 22px Arial;fill:#082847}.p{font:500 15px Arial;fill:#566779}.line{stroke:#0b355d;stroke-width:2.8;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1280" height="720"/>
  <text x="55" y="60" class="k">ASSISTANT LAYER</text><text x="55" y="102" class="title">Operational help grounded in approved project context</text>
  <rect x="65" y="175" width="250" height="320" class="box"/>
  <text x="100" y="225" class="h">Knowledge inputs</text><text x="100" y="265" class="p">Documentation</text><text x="100" y="300" class="p">Reports</text><text x="100" y="335" class="p">Alerts</text><text x="100" y="370" class="p">Logs</text><text x="100" y="405" class="p">Procedures</text>
  <rect x="395" y="215" width="250" height="240" class="box ctx"/><text x="430" y="270" class="h">Retrieval</text><text x="430" y="310" class="p">Find the most relevant</text><text x="430" y="338" class="p">events, rules, assets,</text><text x="430" y="366" class="p">and documentation.</text>
  <rect x="725" y="215" width="250" height="240" class="box ai"/><text x="760" y="270" class="h">Assistant response</text><text x="760" y="310" class="p">Explain the situation,</text><text x="760" y="338" class="p">summarize evidence,</text><text x="760" y="366" class="p">and propose actions.</text>
  <rect x="1055" y="215" width="160" height="240" class="box human"/><text x="1085" y="270" class="h">Operator</text><text x="1085" y="310" class="p">Validates</text><text x="1085" y="338" class="p">sensitive</text><text x="1085" y="366" class="p">actions.</text>
  <path class="line" d="M315 335h80"/><path class="line" d="M645 335h80"/><path class="line" d="M975 335h80"/>
  <text x="395" y="580" class="p">The assistant supports investigation and explanation; it does not silently apply critical security decisions.</text>
</svg>
