<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Resilience mode cycle</title><desc id="desc">Cycle for monitoring, detecting anomaly, switching mode, minimal protection, recovery, and return to normal.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4c3ec7"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102033" flood-opacity=".08"/></filter><style>.bg{fill:#fff}.frame{fill:#fff;stroke:#d7dcea;stroke-width:2;rx:24}.t{font:800 34px Arial;fill:#141633}.st{font:italic 21px Arial;fill:#586071}.step{fill:#fff;stroke:#4c3ec7;stroke-width:2.4;rx:20;filter:url(#s)}.num{fill:#4c3ec7}.numt{font:800 24px Arial;fill:#fff}.h{font:800 20px Arial;fill:#141633}.p{font:500 15px Arial;fill:#344456}.line{stroke:#4c3ec7;stroke-width:7;fill:none;marker-end:url(#a)}.back{stroke:#4c3ec7;stroke-width:6;fill:none;marker-end:url(#a)}.ok{stroke:#178f45}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="t">Resilience mode cycle</text><text x="70" y="112" class="st">The appliance keeps a minimal protective posture, recovers services, then returns to normal operation.</text><g transform="translate(70 300)"><rect class="step" width="185" height="300"/><circle cx="92" cy="-15" r="28" class="num"/><text x="85" y="-6" class="numt">1</text><text x="38" y="115" class="h">Surveillance</text><text x="32" y="160" class="p">services, network,</text><text x="52" y="190" class="p">temperature</text></g><g transform="translate(330 300)"><rect class="step" width="185" height="300"/><circle cx="92" cy="-15" r="28" class="num"/><text x="85" y="-6" class="numt">2</text><text x="30" y="115" class="h">Anomaly detected</text><text x="42" y="160" class="p">failure, outage,</text><text x="62" y="190" class="p">attack</text></g><g transform="translate(590 300)"><rect class="step" width="185" height="300"/><circle cx="92" cy="-15" r="28" class="num"/><text x="85" y="-6" class="numt">3</text><text x="45" y="115" class="h">Mode decision</text><text x="42" y="160" class="p">NORMAL /</text><text x="35" y="190" class="p">DEGRADED / SAFE</text></g><g transform="translate(850 300)"><rect class="step" width="185" height="300"/><circle cx="92" cy="-15" r="28" class="num"/><text x="85" y="-6" class="numt">4</text><text x="35" y="115" class="h">Minimal protection</text><text x="35" y="160" class="p">firewall and</text><text x="45" y="190" class="p">local rules</text></g><g transform="translate(1110 300)"><rect class="step" width="185" height="300"/><circle cx="92" cy="-15" r="28" class="num"/><text x="85" y="-6" class="numt">5</text><text x="58" y="115" class="h">Recovery</text><text x="42" y="160" class="p">checks and</text><text x="22" y="190" class="p">resynchronization</text></g><g transform="translate(1370 300)"><rect class="step" width="185" height="300"/><circle cx="92" cy="-15" r="28" class="num"/><text x="85" y="-6" class="numt">6</text><text x="37" y="115" class="h">Return to normal</text><text x="38" y="160" class="p">services restored</text></g><path d="M255 450h75" class="line"/><path d="M515 450h75" class="line"/><path d="M775 450h75" class="line"/><path d="M1035 450h75" class="line"/><path d="M1295 450h75" class="line"/><path d="M1462 600 C1462 760 162 760 162 600" class="back"/><text x="760" y="810" class="p">continuous return loop</text></svg>