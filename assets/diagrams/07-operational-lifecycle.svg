<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ova Security - operational lifecycle sequence</title>
  <desc id="desc">Sequence-style operational lifecycle inspired by the report sequence diagram.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#111"/></marker><style>.bg{fill:#fff}.box{fill:#fff;stroke:#111;stroke-width:2;rx:8}.head{font:800 18px Arial;fill:#111}.txt{font:600 16px Arial;fill:#111}.life{stroke:#111;stroke-width:1.8;stroke-dasharray:8 8}.call{stroke:#111;stroke-width:2.2;fill:none;marker-end:url(#a)}.return{stroke:#111;stroke-width:2;fill:none;marker-end:url(#a)}.title{font:800 34px Arial;fill:#0b2d63}.sub{font:italic 22px Arial;fill:#0b2d63}</style></defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="70" y="70" class="title">Operational lifecycle</text><text x="70" y="108" class="sub">From observation to validated action and signed evidence</text>
  <g transform="translate(70 150)"><rect class="box" width="150" height="60"/><text x="28" y="38" class="head">Operator</text><path class="life" d="M75 60v650"/></g>
  <g transform="translate(300 150)"><rect class="box" width="170" height="60"/><text x="35" y="38" class="head">Dashboard</text><path class="life" d="M85 60v650"/></g>
  <g transform="translate(560 150)"><rect class="box" width="180" height="60"/><text x="35" y="38" class="head">Backend API</text><path class="life" d="M90 60v650"/></g>
  <g transform="translate(840 150)"><rect class="box" width="180" height="60"/><text x="30" y="38" class="head">Detection</text><path class="life" d="M90 60v650"/></g>
  <g transform="translate(1110 150)"><rect class="box" width="180" height="60"/><text x="38" y="38" class="head">Firewall</text><path class="life" d="M90 60v650"/></g>
  <g transform="translate(1370 150)"><rect class="box" width="170" height="60"/><text x="35" y="38" class="head">Ledger</text><path class="life" d="M85 60v650"/></g>
  <path class="call" d="M145 265h240"/><text x="170" y="250" class="txt">1. Check network state</text>
  <path class="call" d="M385 330h265"/><text x="420" y="315" class="txt">2. Request events</text>
  <path class="call" d="M650 395h280"/><text x="690" y="380" class="txt">3. Collect alerts and logs</text>
  <path class="return" d="M930 450H650"/><text x="700" y="435" class="txt">4. Return context</text>
  <path class="call" d="M650 515h550"/><text x="745" y="500" class="txt">5. Validate defensive decision</text>
  <path class="return" d="M1200 570H650"/><text x="800" y="555" class="txt">6. Confirmation</text>
  <path class="call" d="M650 635h805"/><text x="825" y="620" class="txt">7. Write signed evidence</text>
  <path class="return" d="M1455 700H385"/><text x="720" y="685" class="txt">8. Incident status updated</text>
  <path class="return" d="M385 760H145"/><text x="180" y="745" class="txt">9. Action visible to operator</text>
</svg>
