<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Linux appliance runtime</title><desc id="desc">Layered runtime for Ova Security appliance.</desc><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102033" flood-opacity=".10"/></filter><style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#d4dde7;stroke-width:2;rx:24}.t{font:800 34px Arial;fill:#102033}.st{font:italic 21px Arial;fill:#526273}.box{fill:#fff;stroke:#c9d6e2;stroke-width:1.7;rx:14;filter:url(#s)}.b1{fill:#eef4fb;stroke:#315f95}.b2{fill:#edf7f8;stroke:#16868a}.b3{fill:#f4f7ef;stroke:#6f8f3a}.h{font:800 22px Arial;fill:#102033}.p{font:500 16px Arial;fill:#344456}.small{font:500 14px Arial;fill:#607080}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="t">Linux appliance runtime</text><text x="70" y="112" class="st">Base layer for services, storage, network interfaces, scheduling, and recovery.</text><rect x="170" y="190" width="1260" height="110" class="box b1"/><text x="230" y="238" class="h">Hardware edge appliance</text><text x="230" y="270" class="p">CPU, memory, wired interfaces, local disk, power profile</text><rect x="250" y="350" width="1100" height="110" class="box"/><text x="310" y="398" class="h">Operating system</text><text x="310" y="430" class="p">Linux permissions, users, filesystem layout, package/runtime environment</text><rect x="330" y="510" width="940" height="110" class="box b2"/><text x="390" y="558" class="h">Service supervision</text><text x="390" y="590" class="p">Starts, restarts, monitors, and isolates appliance services</text><rect x="410" y="670" width="780" height="110" class="box b3"/><text x="470" y="718" class="h">Scheduled operations</text><text x="470" y="750" class="p">Periodic collection, rotation, health checks, maintenance tasks</text><text x="215" y="840" class="small">Result: the appliance can keep security services running locally and recover controlled components without exposing private deployment details.</text></svg>