<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Firewall engine</title><desc id="desc">Network-zone firewall decision path.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f95"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102033" flood-opacity=".10"/></filter><style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#d4dde7;stroke-width:2;rx:24}.t{font:800 34px Arial;fill:#102033}.st{font:italic 21px Arial;fill:#526273}.zone{fill:#fff;stroke:#c9d6e2;stroke-width:1.8;rx:18;filter:url(#s)}.wan{fill:#fbf6ea;stroke:#9a7a33}.fw{fill:#edf7f8;stroke:#16868a}.lan{fill:#eef7f1;stroke:#3d895b}.adm{fill:#eef4fb;stroke:#315f95}.h{font:800 22px Arial;fill:#102033}.p{font:500 16px Arial;fill:#344456}.line{stroke:#315f95;stroke-width:5;fill:none;marker-end:url(#a)}.deny{stroke:#b74b4b;stroke-width:4;fill:none;marker-end:url(#a)}.tag{font:800 15px Arial;fill:#315f95}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="t">Firewall engine</text><text x="70" y="112" class="st">Applies validated policy at the edge and returns auditable decisions.</text><rect x="90" y="250" width="300" height="210" class="zone wan"/><text x="150" y="315" class="h">WAN side</text><text x="130" y="355" class="p">incoming traffic</text><text x="130" y="385" class="p">untrusted sources</text><rect x="650" y="190" width="300" height="330" class="zone fw"/><text x="725" y="250" class="h">Policy core</text><text x="705" y="305" class="p">zone rules</text><text x="705" y="340" class="p">allow / deny</text><text x="705" y="375" class="p">block list</text><text x="705" y="410" class="p">operator validation</text><rect x="1210" y="250" width="300" height="210" class="zone lan"/><text x="1270" y="315" class="h">Protected LAN</text><text x="1250" y="355" class="p">validated flows</text><text x="1250" y="385" class="p">internal services</text><rect x="650" y="650" width="300" height="130" class="zone adm"/><text x="705" y="705" class="h">Audit event</text><text x="705" y="735" class="p">rule change recorded</text><path d="M390 355h260" class="line"/><path d="M950 355h260" class="line"/><path d="M800 520v130" class="line"/><path d="M650 430 C520 520 420 520 350 455" class="deny"/><text x="465" y="325" class="tag">traffic</text><text x="1015" y="325" class="tag">allowed</text><text x="430" y="540" class="tag">blocked</text></svg>