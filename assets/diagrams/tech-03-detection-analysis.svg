<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Intrusion detection and traffic analysis</title><desc id="desc">Detection pipeline from traffic capture to correlated incident context.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f95"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102033" flood-opacity=".10"/></filter><style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#d4dde7;stroke-width:2;rx:24}.t{font:800 34px Arial;fill:#102033}.st{font:italic 21px Arial;fill:#526273}.box{fill:#fff;stroke:#c9d6e2;stroke-width:1.8;rx:18;filter:url(#s)}.cap{fill:#eef4fb;stroke:#315f95}.ana{fill:#edf7f8;stroke:#16868a}.ctx{fill:#f1f0f8;stroke:#7060a8}.out{fill:#eef7f1;stroke:#3d895b}.h{font:800 21px Arial;fill:#102033}.p{font:500 15px Arial;fill:#344456}.line{stroke:#315f95;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="t">Intrusion detection and traffic analysis</text><text x="70" y="112" class="st">Turns observed network activity into alerts, metadata, and investigation context.</text><rect x="100" y="350" width="260" height="160" class="box cap"/><text x="150" y="405" class="h">Capture</text><text x="135" y="445" class="p">network sessions</text><text x="135" y="475" class="p">protocol metadata</text><rect x="470" y="260" width="260" height="160" class="box ana"/><text x="520" y="315" class="h">Signature analysis</text><text x="505" y="355" class="p">known patterns</text><text x="505" y="385" class="p">suspicious behavior</text><rect x="470" y="535" width="260" height="160" class="box ana"/><text x="520" y="590" class="h">Flow analysis</text><text x="505" y="630" class="p">who talked to whom</text><text x="505" y="660" class="p">service context</text><rect x="860" y="350" width="280" height="160" class="box ctx"/><text x="920" y="405" class="h">Correlation</text><text x="895" y="445" class="p">asset + alert + history</text><text x="895" y="475" class="p">risk interpretation</text><rect x="1260" y="350" width="260" height="160" class="box out"/><text x="1315" y="405" class="h">Output</text><text x="1295" y="445" class="p">incident context</text><text x="1295" y="475" class="p">dashboard alert</text><path d="M360 430h110" class="line"/><path d="M730 340 C800 340 800 430 860 430" class="line"/><path d="M730 615 C800 615 800 430 860 430" class="line"/><path d="M1140 430h120" class="line"/></svg>