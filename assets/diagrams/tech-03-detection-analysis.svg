<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Intrusion detection and traffic analysis</title>
<desc id="desc">Turns observed traffic into security alerts, protocol metadata, and investigation context.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1E5AA8"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F33" flood-opacity=".10"/></filter>
<style>
.bg{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#C9D6E2;stroke-width:2.2;rx:26}.box{fill:#FFFFFF;stroke:#C9D6E2;stroke-width:1.7;rx:16;filter:url(#shadow)}.boxBlue{fill:#EEF5FC;stroke:#1E5AA8;stroke-width:2;rx:16;filter:url(#shadow)}.boxTeal{fill:#EAF6F8;stroke:#0F8B8D;stroke-width:2;rx:16;filter:url(#shadow)}.boxGreen{fill:#EAF7EF;stroke:#2E8B57;stroke-width:2;rx:16;filter:url(#shadow)}.boxViolet{fill:#F1F0FA;stroke:#6C5BA7;stroke-width:2;rx:16;filter:url(#shadow)}.boxAmber{fill:#F7F1E3;stroke:#A07A2B;stroke-width:2;rx:16;filter:url(#shadow)}.title{font:800 34px Arial;fill:#0B1F33}.subtitle{font:italic 21px Arial;fill:#4B5B6B}.section{font:800 22px Arial;fill:#0B1F33}.text{font:500 16px Arial;fill:#253545}.small{font:500 14px Arial;fill:#4B5B6B}.tag{font:800 14px Arial;fill:#1E5AA8;letter-spacing:1.4px}.arrow{stroke:#1E5AA8;stroke-width:4;fill:none;marker-end:url(#arrow)}.arrowSoft{stroke:#6F8CAD;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6F8CAD;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}.divider{stroke:#C9D6E2;stroke-width:1.5}.num{font:800 18px Arial;fill:#1E5AA8}
</style>
</defs>
<rect class="bg" width="1600" height="900"/><rect x="24" y="24" width="1552" height="852" class="frame"/>
<text x="70" y="76" class="title">Intrusion detection and traffic analysis</text><text x="70" y="112" class="subtitle">Turns observed traffic into security alerts, protocol metadata, and investigation context.</text><rect x="90" y="210" width="390" height="520" class="boxBlue"/><text x="145" y="265" class="section">Inputs</text><rect x="130" y="290" width="310" height="58" class="box"/><text x="160" y="325" class="text">Routed or mirrored traffic</text><rect x="130" y="375" width="310" height="58" class="box"/><text x="160" y="410" class="text">Protocol sessions</text><rect x="130" y="460" width="310" height="58" class="box"/><text x="160" y="495" class="text">Suspicious signatures</text><rect x="130" y="545" width="310" height="58" class="box"/><text x="160" y="580" class="text">Service behavior</text><rect x="605" y="185" width="390" height="570" class="boxTeal"/><text x="705" y="245" class="section">Processing role</text><line x1="650" y1="295" x2="950" y2="295" class="divider"/><text x="655" y="350" class="text">Receives operational context</text><text x="655" y="400" class="text">Applies its specialized function</text><text x="655" y="450" class="text">Returns structured information</text><text x="655" y="500" class="text">Feeds dashboard and evidence flow</text><text x="655" y="585" class="small">Integrated by the backend so the operator sees one coherent product instead of isolated tools.</text><rect x="1120" y="210" width="390" height="520" class="boxGreen"/><text x="1175" y="265" class="section">Outputs</text><rect x="1160" y="290" width="310" height="58" class="box"/><text x="1190" y="325" class="text">Alerts with severity</text><rect x="1160" y="375" width="310" height="58" class="box"/><text x="1190" y="410" class="text">Flow metadata</text><rect x="1160" y="460" width="310" height="58" class="box"/><text x="1190" y="495" class="text">Asset communication map</text><rect x="1160" y="545" width="310" height="58" class="box"/><text x="1190" y="580" class="text">Incident context</text><path d="M480 470h125" class="arrow"/><path d="M995 470h125" class="arrow"/></svg>