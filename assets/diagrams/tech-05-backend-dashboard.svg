<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Backend API and dashboard</title><desc id="desc">Hub-and-spoke architecture for backend orchestration and dashboard views.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f95"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102033" flood-opacity=".10"/></filter><style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#d4dde7;stroke-width:2;rx:24}.t{font:800 34px Arial;fill:#102033}.st{font:italic 21px Arial;fill:#526273}.hub{fill:#edf7f8;stroke:#16868a;stroke-width:2.2;rx:30;filter:url(#s)}.box{fill:#fff;stroke:#c9d6e2;stroke-width:1.7;rx:14;filter:url(#s)}.blue{fill:#eef4fb;stroke:#315f95}.green{fill:#eef7f1;stroke:#3d895b}.violet{fill:#f1f0f8;stroke:#7060a8}.h{font:800 21px Arial;fill:#102033}.p{font:500 15px Arial;fill:#344456}.line{stroke:#315f95;stroke-width:3.2;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="t">Backend API and dashboard</text><text x="70" y="112" class="st">The backend unifies sensors, storage, workflow, reports, and dashboard supervision.</text><rect x="620" y="330" width="360" height="220" class="hub"/><text x="720" y="405" class="h">Backend API</text><text x="685" y="445" class="p">normalization, rules, risk, reports</text><text x="704" y="475" class="p">one product coordination point</text><rect x="110" y="210" width="285" height="120" class="box blue"/><text x="160" y="265" class="h">Sensors</text><text x="160" y="295" class="p">alerts and traffic data</text><rect x="110" y="590" width="285" height="120" class="box green"/><text x="160" y="645" class="h">Evidence store</text><text x="160" y="675" class="p">signed audit records</text><rect x="1205" y="210" width="285" height="120" class="box violet"/><text x="1260" y="265" class="h">Dashboard</text><text x="1260" y="295" class="p">operator supervision</text><rect x="1205" y="590" width="285" height="120" class="box blue"/><text x="1260" y="645" class="h">Reports</text><text x="1260" y="675" class="p">exports and summaries</text><path d="M395 270 C510 270 540 390 620 410" class="line"/><path d="M395 650 C510 650 540 500 620 470" class="line"/><path d="M980 410 C1080 385 1110 270 1205 270" class="line"/><path d="M980 470 C1080 505 1110 650 1205 650" class="line"/></svg>