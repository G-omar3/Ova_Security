<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Signed ledger</title><desc id="desc">Tamper-evident chain for sensitive events and administrative actions.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f95"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102033" flood-opacity=".10"/></filter><style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#d4dde7;stroke-width:2;rx:24}.t{font:800 34px Arial;fill:#102033}.st{font:italic 21px Arial;fill:#526273}.rec{fill:#fff;stroke:#c9d6e2;stroke-width:1.7;rx:14;filter:url(#s)}.hash{fill:#f1f0f8;stroke:#7060a8}.ok{fill:#eef7f1;stroke:#3d895b}.bad{fill:#fbf1f1;stroke:#a84c4c}.h{font:800 20px Arial;fill:#102033}.p{font:500 15px Arial;fill:#344456}.line{stroke:#315f95;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#7060a8;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="t">Signed ledger</text><text x="70" y="112" class="st">Each sensitive event is hashed, linked to the previous record, signed, and verified.</text><rect x="120" y="330" width="260" height="145" class="rec"/><text x="165" y="380" class="h">Event n-1</text><text x="160" y="415" class="p">previous_hash</text><text x="160" y="445" class="p">event_hash</text><rect x="520" y="330" width="260" height="145" class="rec hash"/><text x="565" y="380" class="h">Event n</text><text x="560" y="415" class="p">links previous hash</text><text x="560" y="445" class="p">new event hash</text><rect x="920" y="330" width="260" height="145" class="rec"/><text x="965" y="380" class="h">Event n+1</text><text x="960" y="415" class="p">chain continues</text><text x="960" y="445" class="p">signature checked</text><rect x="1280" y="230" width="230" height="110" class="rec ok"/><text x="1320" y="280" class="h">Valid</text><text x="1310" y="310" class="p">proof accepted</text><rect x="1280" y="540" width="230" height="110" class="rec bad"/><text x="1320" y="590" class="h">Invalid</text><text x="1310" y="620" class="p">alteration detected</text><path d="M380 402h140" class="line"/><path d="M780 402h140" class="line"/><path d="M1180 382 C1230 330 1240 285 1280 285" class="dash"/><path d="M1180 430 C1230 495 1240 595 1280 595" class="dash"/></svg>