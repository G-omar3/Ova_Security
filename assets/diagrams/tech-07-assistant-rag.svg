<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Assistant and RAG layer</title><desc id="desc">Retrieval augmented assistant for incident explanation and diagnostic guidance.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f95"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102033" flood-opacity=".10"/></filter><style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#d4dde7;stroke-width:2;rx:24}.t{font:800 34px Arial;fill:#102033}.st{font:italic 21px Arial;fill:#526273}.box{fill:#fff;stroke:#c9d6e2;stroke-width:1.7;rx:14;filter:url(#s)}.q{fill:#eef4fb;stroke:#315f95}.kb{fill:#eef7f1;stroke:#3d895b}.rag{fill:#f1f0f8;stroke:#7060a8}.ans{fill:#edf7f8;stroke:#16868a}.h{font:800 21px Arial;fill:#102033}.p{font:500 15px Arial;fill:#344456}.line{stroke:#315f95;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#6f7d8d;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1600" height="920"/><rect x="24" y="24" width="1552" height="872" class="frame"/><text x="70" y="76" class="t">Assistant and RAG layer</text><text x="70" y="112" class="st">The assistant answers using retrieved project context and leaves critical decisions to the operator.</text><rect x="110" y="350" width="270" height="130" class="box q"/><text x="165" y="405" class="h">Question</text><text x="145" y="440" class="p">plain language request</text><rect x="480" y="190" width="270" height="130" class="box kb"/><text x="535" y="245" class="h">Knowledge base</text><text x="520" y="280" class="p">docs, reports, procedures</text><rect x="480" y="530" width="270" height="130" class="box kb"/><text x="535" y="585" class="h">Local events</text><text x="520" y="620" class="p">alerts, logs, evidence</text><rect x="860" y="350" width="270" height="130" class="box rag"/><text x="925" y="405" class="h">Retrieval</text><text x="895" y="440" class="p">select relevant context</text><rect x="1230" y="350" width="270" height="130" class="box ans"/><text x="1285" y="405" class="h">Answer</text><text x="1265" y="440" class="p">explain and recommend</text><path d="M380 415h480" class="line"/><path d="M750 255 C820 280 840 345 860 395" class="dash"/><path d="M750 595 C820 560 840 480 860 435" class="dash"/><path d="M1130 415h100" class="line"/></svg>